[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transitkg"
version = "0.1.0"
description = "Static GTFS grounding and evaluation tools for TransitKG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.0",
    "neo4j==6.4.1",
]

[project.optional-dependencies]
plots = ["matplotlib==3.10.8"]

[tool.setuptools.packages.find]
where = ["src"]

